# Mochi Squad — default local runtime config
# Copy to ${HERMES_HOME}/mochi-squad/config.yaml and edit for your deployment.

kanban:
  db_path: auto

watchers:
  blocked:
    enabled: false
    schedule: "every 5m"
    notify_target: origin
    script: mochi-squad-blocked-watchdog.py

virtual_office:
  enabled: false
  listen_host: 127.0.0.1
  port: 3000
  public_base_url: null
